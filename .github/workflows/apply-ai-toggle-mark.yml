name: Apply AI Toggle Mark

on:
  push:
    branches:
      - test/chat-web-ai-toggle
    paths:
      - .github/scripts/apply_ai_toggle.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: test/chat-web-ai-toggle

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply focused patch
        run: python .github/scripts/apply_ai_toggle.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Run focused toggle test
        run: npm test -- src/features/workspace/components/AiConversationPanel.toggle.test.ts

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/workspace/components/AiConversationPanel.tsx src/app/globals.css
          git commit -m "feat(ui): replace AI toggle monogram with Morpho mark"
          git push origin HEAD:test/chat-web-ai-toggle
